servers:
  # Relative on purpose: the docs are served by the API itself, so this
  # resolves to whichever deployment you are reading, and "Try it out" is
  # always same-origin, which is what lets the session cookie ride along.
  - url: /
    description: This deployment
  - url: http://localhost:3000
    description: Local development

# Every operation requires a session cookie unless it overrides this with
# `security: []` (public) or names a different scheme.
security:
  - sessionCookie: []

tags:
  - name: Health
    description: Liveness and readiness probes. Unauthenticated, and outside the versioned API.
  - name: Auth
    description: |
      Registration, login, and session lifecycle for both staff and customers.
      Supports password login, one-time code login with no password, Google
      sign-in, and optional two-factor.
  - name: Account
    description: |
      Changing your own password, email, or phone. Contact changes are
      confirmed out of band before the new value becomes a login identifier.
  - name: Public
    description: |
      The unauthenticated browse surface behind the landing page and the live
      demo board. Read-only, and the only endpoints in the service that need
      no session.
  - name: Payments
    description: |
      Paystack checkout, the signed webhook that settles a booking, and the
      refund path. Amounts are integer pesewas throughout.
  - name: Bookings
    description: Reservations against a tour, a hotel room, or a flight, and their cancellation.
  - name: Tours
    description: Guided tour inventory, with guest capacity and status tracking.
  - name: Destinations
    description: The country and city hubs that tours, hotels, and flights hang off.
  - name: Hotels
    description: Hotel inventory.
  - name: Rooms
    description: Room inventory and per-night availability within a hotel.
  - name: Flights
    description: Flight inventory, seat counts, and live status.
  - name: Users
    description: Staff accounts. Administrators manage the roster.
  - name: Customers
    description: Customer accounts and their booking and payment history.
  - name: Reviews
    description: |
      Verified reviews. A customer may only review a trip they actually took,
      one review per booking, and staff moderate what gets published.
  - name: Dashboard
    description: Aggregated figures for the signed-in principal, widening for staff.
  - name: Reports
    description: Filtered reporting over bookings, payments, tours, and agent activity.
