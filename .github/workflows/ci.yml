name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: traveltrek
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Base DB URL; the test harness derives `traveltrek_test` from it.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/traveltrek
      # Required by the fail-fast env module (placeholders — no real services hit in CI).
      REDIS_URL: redis://localhost:6379
      ACCESS_TOKEN_SECRET: ci_access_secret
      REFRESH_TOKEN_SECRET: ci_refresh_secret
      CLOUDINARY_CLOUD_NAME: test
      CLOUDINARY_API_KEY: test
      CLOUDINARY_API_SECRET: test
      PAYSTACK_SECRET_KEY: sk_test_ci_placeholder

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # Runs the postinstall `prisma generate` too.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run type-check

      # API reference gate: validates the OpenAPI document and diffs it against
      # the routes the app actually mounts. A new endpoint shipped without docs,
      # or a documented path that no longer exists, fails here rather than
      # leaving the public reference quietly wrong.
      - name: Check API reference matches the routes
        run: npm run docs:check

      - name: Build
        run: npm run build

      - name: Test
        run: npm test --if-present

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    env:
      NEXT_PUBLIC_SERVER_URI: http://localhost:8000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run type-check

      - name: Build
        run: npm run build

      - name: Test
        run: npm test --if-present
