name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Superseded runs (a force-push to the same ref) are cancelled instead of
# burning runner minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: traveltrek
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Base DB URL; the test harness derives `traveltrek_test` from it.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/traveltrek
      # Required by the fail-fast env module (placeholders — no real services hit in CI).
      REDIS_URL: redis://localhost:6379
      ACCESS_TOKEN_SECRET: ci_access_secret
      REFRESH_TOKEN_SECRET: ci_refresh_secret
      CLOUDINARY_CLOUD_NAME: test
      CLOUDINARY_API_KEY: test
      CLOUDINARY_API_SECRET: test
      PAYSTACK_SECRET_KEY: sk_test_ci_placeholder

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # Runs the postinstall `prisma generate` too.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run type-check

      # API reference gate: validates the OpenAPI document and diffs it against
      # the routes the app actually mounts. A new endpoint shipped without docs,
      # or a documented path that no longer exists, fails here rather than
      # leaving the public reference quietly wrong.
      - name: Check API reference matches the routes
        run: npm run docs:check

      # Schema drift gate: a schema.prisma edit committed without a migration
      # fails here instead of surfacing at deploy time, when the running code
      # already expects a column the database has never heard of. `migrate
      # diff` does not create its own shadow database, so make one first.
      - name: Create drift-check database
        run: PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE traveltrek_drift_check;"

      # prisma.config.ts reads SHADOW_DATABASE_URL: Prisma 7 takes the replay
      # database from the config, not from the environment directly.
      - name: Check migrations match the schema
        run: npx prisma migrate diff --from-migrations prisma/migrations --to-schema prisma/schema.prisma --exit-code
        env:
          SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/traveltrek_drift_check

      - name: Build
        run: npm run build

      - name: Test
        run: npm test --if-present

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    env:
      NEXT_PUBLIC_SERVER_URI: http://localhost:8000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run type-check

      - name: Build
        run: npm run build

      - name: Test
        run: npm test --if-present

  # Fails the build on a known HIGH/critical advisory in a production
  # dependency (see scripts/audit-gate.mjs). The tree is clean today; this is
  # what stops the next one from shipping unnoticed. Dev-only and moderate
  # advisories do not block, and the wrapper carries an allowlist for
  # advisories that provably cannot apply here - currently empty, which is the
  # goal state.
  security-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm run audit:ci
